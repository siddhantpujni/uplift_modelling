[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "criteo-uplift-modelling"
version = "0.1.0"
description = "Reproducible uplift modelling analysis on the Criteo randomized experiment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6"]
ml = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
